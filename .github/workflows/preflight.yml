name: Preflight — keys and model ids

# A canary ahead of the paid sweep. One cheap call per model confirms the key
# is accepted, the account has credit, and the model id still resolves — so a
# lapsed card or a retired model id is found days before the monthly run
# rather than halfway through it.
on:
  schedule:
    # The 25th, a week before the elicitation cron on the 1st.
    - cron: '0 13 25 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || vars.ELICITATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight
        id: check
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.MINSTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY || secrets.KIMI_API_KEY }}
        run: |
          set -euo pipefail
          node tools/run-elicitation.mjs --check | tee preflight.txt
          {
            echo '## Preflight'
            echo
            echo '```'
            cat preflight.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue if a model is not callable
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create preflight --color FBCA04 --description "Roster or key needs attention" 2>/dev/null || true
          if [ -n "$(gh issue list --label preflight --state open --limit 1 --json number --jq '.[].number')" ]; then
            echo "A preflight issue is already open — not filing another."
            exit 0
          fi
          gh issue create \
            --title "Preflight failed before the monthly elicitation" \
            --label preflight \
            --body "$(printf '%s\n' \
              "At least one model on the roster could not be called." \
              "" \
              "Per-model detail is in the job summary: $RUN_URL" \
              "" \
              "Usual causes: an expired key, an account with no credit, or a model id the provider has retired. Fix it before the 1st, or the monthly sweep will come back short.")"
