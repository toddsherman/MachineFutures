name: CI

# runs/ is the irreplaceable half of this repository — public/data.js can be
# regenerated from it, and it cannot be regenerated from anything. Check it on
# every push rather than only after an elicitation.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  # Needed to raise an issue when main goes red.
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # One command that runs them all and reports every failure, rather than
      # a chain where the first failure hides the rest.
      - name: Checks
        run: node tools/check-all.mjs

      # The importer must be a pure function of runs/: if re-running it changes
      # public/data.js, the committed file was hand-edited or is out of date.
      - name: Published data matches runs/
        run: |
          set -euo pipefail
          node tools/import-runs.mjs
          node tools/export-data.mjs
          if ! git diff --quiet public/data.js data; then
            echo "::error::public/data.js or data/ does not match what runs/ produces. Run tools/import-runs.mjs and tools/export-data.mjs and commit the result."
            git --no-pager diff --stat public/data.js data
            exit 1
          fi
          echo "public/data.js and data/ are reproducible from runs/"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      # The runner has none of the condensed faces the design asks for, so it
      # renders the pessimistic fallback — which is exactly the case that
      # clipped headings on iOS.
      - name: Layout and behaviour
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  alert:
    needs: [check, browser]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update a build-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh label create build --color D93F0B --description "main is failing CI" 2>/dev/null || true
          BODY="$(printf '%s\n' \
            "CI is failing on \`main\`." \
            "" \
            "Commit: \`${SHA:0:7}\`" \
            "Run: $RUN_URL" \
            "" \
            "This issue stays open until a run on main passes. A red main went unnoticed for three commits once; that is what this exists to prevent.")"
          EXISTING=$(gh issue list --repo "$REPO" --label build --state open --limit 1 --json number --jq '.[].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "CI is failing on main" --label build --body "$BODY"
          fi

  clear-alert:
    needs: [check, browser]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the build-failure issue if one is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NUM=$(gh issue list --repo "$REPO" --label build --state open --limit 1 --json number --jq '.[].number')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "$REPO" --comment "Green again: $RUN_URL"
          fi
