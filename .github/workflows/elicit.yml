name: Elicit end-state forecasts

on:
  schedule:
    # 14:00 UTC on the 1st of every month. Scheduled sweeps ask all five
    # horizons. Three ordered matrix waves own one active model at a time and ask
    # at most two horizons in sequence, preserving the per-horizon budget
    # without ever calling the same model concurrently.
    - cron: '0 14 1 * *'
  workflow_dispatch:
    inputs:
      horizons:
        description: 'Forecast horizon(s)'
        type: choice
        required: true
        default: long-term
        options:
          - long-term
          - '2030'
          - '2040'
          - '2050'
          - '2060'
          - 2030+2040
          - all
      models:
        description: 'Comma-separated active model keys from tools/models.json (default: all active)'
        required: false
      samples:
        description: 'Samples per model and horizon'
        required: false
        default: '20'
      check_only:
        description: 'Preflight only — verify keys and model ids, elicit nothing'
        type: boolean
        required: false
        default: false
      list_models:
        description: 'List the models each provider serves, then stop'
        type: boolean
        required: false
        default: false
      budget_minutes:
        description: 'Per-model, per-horizon wall-clock budget in minutes'
        required: false
        default: '100'
      resume_from_run_id:
        description: 'Restore the combined runs artifact from a previous workflow run id and buy only what is missing'
        required: false

# A second sweep should wait, not race the first one to publish competing
# branches or spend twice on the same model/date/horizon.
concurrency:
  group: machine-futures-elicitation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || vars.ELICITATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      should_elicit: ${{ steps.plan.outputs.should_elicit }}
      horizons: ${{ steps.plan.outputs.horizons }}
      wave_one_horizons: ${{ steps.plan.outputs.wave_one_horizons }}
      wave_two_horizons: ${{ steps.plan.outputs.wave_two_horizons }}
      wave_three_horizons: ${{ steps.plan.outputs.wave_three_horizons }}
      has_wave_two: ${{ steps.plan.outputs.has_wave_two }}
      has_wave_three: ${{ steps.plan.outputs.has_wave_three }}
      sweep_horizons: ${{ steps.plan.outputs.sweep_horizons }}
      target_samples: ${{ steps.plan.outputs.target_samples }}
      sweep_plan: ${{ steps.plan.outputs.sweep_plan }}
      models: ${{ steps.plan.outputs.models }}
      run_date: ${{ steps.plan.outputs.run_date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore the original elicitation date
        if: ${{ inputs.resume_from_run_id != '' && !inputs.check_only && !inputs.list_models }}
        uses: actions/download-artifact@v4
        with:
          name: runs-${{ inputs.resume_from_run_id }}
          path: plan-restored/
          run-id: ${{ inputs.resume_from_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the model and horizon matrices
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          HORIZON_SELECTION: ${{ inputs.horizons }}
          REQUESTED_MODELS: ${{ inputs.models }}
          CHECK_ONLY: ${{ inputs.check_only }}
          LIST_MODELS: ${{ inputs.list_models }}
          RESUME_RUN_ID: ${{ inputs.resume_from_run_id }}
          REQUESTED_SAMPLES: ${{ inputs.samples || '20' }}
          BUDGET_MINUTES: ${{ inputs.budget_minutes || '100' }}
        run: |
          set -euo pipefail

          if [ "${CHECK_ONLY:-false}" = "true" ] || [ "${LIST_MODELS:-false}" = "true" ]; then
            echo 'should_elicit=false' >> "$GITHUB_OUTPUT"
            echo 'horizons=[]' >> "$GITHUB_OUTPUT"
            echo 'wave_one_horizons=[]' >> "$GITHUB_OUTPUT"
            echo 'wave_two_horizons=[]' >> "$GITHUB_OUTPUT"
            echo 'wave_three_horizons=[]' >> "$GITHUB_OUTPUT"
            echo 'has_wave_two=false' >> "$GITHUB_OUTPUT"
            echo 'has_wave_three=false' >> "$GITHUB_OUTPUT"
            echo 'sweep_horizons=[]' >> "$GITHUB_OUTPUT"
            echo 'target_samples=' >> "$GITHUB_OUTPUT"
            echo 'sweep_plan={}' >> "$GITHUB_OUTPUT"
            echo 'models=[]' >> "$GITHUB_OUTPUT"
            echo 'run_date=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${RESUME_RUN_ID:-}" ]; then
            mapfile -t restored_dates < <(find plan-restored -type f -name '.elicitation-date' -exec sh -c 'tr -d "[:space:]" < "$1"; printf "\n"' _ '{}' \; | sort -u)
            if [ "${#restored_dates[@]}" -eq 0 ]; then
              echo "::error::The runs-$RESUME_RUN_ID artifact has no elicitation-date manifest; refusing to resume under a new date."
              exit 1
            fi
            if [ "${#restored_dates[@]}" -ne 1 ]; then
              echo "::error::The runs-$RESUME_RUN_ID artifact contains conflicting elicitation dates: ${restored_dates[*]}"
              exit 1
            fi
            run_date="${restored_dates[0]}"
          else
            run_date=$(date -u +%F)
          fi
          RUN_DATE="$run_date" node -e 'const value=process.env.RUN_DATE; const date=new Date(`${value}T00:00:00Z`); if (!/^\d{4}-\d{2}-\d{2}$/.test(value) || Number.isNaN(date.valueOf()) || date.toISOString().slice(0,10)!==value) throw new Error(`invalid elicitation date ${JSON.stringify(value)}`)'

          selection="${HORIZON_SELECTION:-all}"
          if [ "$EVENT_NAME" = "schedule" ]; then selection=all; fi
          case "$selection" in
            long-term) horizons='["long-term"]' ;;
            2030) horizons='["2030"]' ;;
            2040) horizons='["2040"]' ;;
            2050) horizons='["2050"]' ;;
            2060) horizons='["2060"]' ;;
            2030+2040) horizons='["2030","2040"]' ;;
            all) horizons='["long-term","2030","2040","2050","2060"]' ;;
            *) echo "::error::Unsupported horizon selection: $selection"; exit 1 ;;
          esac

          # Work may be resumed for only the failed model/horizon subset, but
          # publication continues to use the original immutable sweep plan.
          # Artifacts from before the plan existed are upgraded conservatively
          # from every finalized batch/checkpoint on the restored run date.
          plan_args=(
            --resolve-plan
            --horizons-json "$horizons"
            --date "$run_date"
            --samples "${REQUESTED_SAMPLES:-20}"
          )
          if [ -n "${RESUME_RUN_ID:-}" ]; then plan_args+=(--restored plan-restored); fi
          sweep_plan=$(node tools/check-sweep.mjs "${plan_args[@]}")
          sweep_horizons=$(SWEEP_PLAN_JSON="$sweep_plan" node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.env.SWEEP_PLAN_JSON).horizons.map(horizon => horizon.id)))')
          target_samples=$(SWEEP_PLAN_JSON="$sweep_plan" node -e 'process.stdout.write(String(JSON.parse(process.env.SWEEP_PLAN_JSON).target_samples))')

          # One model's horizons run in three globally ordered waves. Each wave
          # asks at most two horizons sequentially, so a 100-minute budget still
          # leaves ample time for the always-run artifact upload before the
          # 330-minute job timeout. The barrier between waves prevents the same
          # model from being called concurrently.
          wave_one_horizons=$(HORIZONS_JSON="$horizons" node -e '
            const horizons = JSON.parse(process.env.HORIZONS_JSON);
            process.stdout.write(JSON.stringify(horizons.slice(0, 2)));
          ')
          wave_two_horizons=$(HORIZONS_JSON="$horizons" node -e '
            const horizons = JSON.parse(process.env.HORIZONS_JSON);
            process.stdout.write(JSON.stringify(horizons.slice(2, 4)));
          ')
          wave_three_horizons=$(HORIZONS_JSON="$horizons" node -e '
            const horizons = JSON.parse(process.env.HORIZONS_JSON);
            process.stdout.write(JSON.stringify(horizons.slice(4, 6)));
          ')
          has_wave_two=$(HORIZONS_JSON="$wave_two_horizons" node -e '
            process.stdout.write(JSON.parse(process.env.HORIZONS_JSON).length ? "true" : "false");
          ')
          has_wave_three=$(HORIZONS_JSON="$wave_three_horizons" node -e '
            process.stdout.write(JSON.parse(process.env.HORIZONS_JSON).length ? "true" : "false");
          ')
          HORIZONS_JSON="$horizons" WAVE_ONE_JSON="$wave_one_horizons" WAVE_TWO_JSON="$wave_two_horizons" WAVE_THREE_JSON="$wave_three_horizons" node -e '
            const horizons = JSON.parse(process.env.HORIZONS_JSON);
            const assigned = [process.env.WAVE_ONE_JSON, process.env.WAVE_TWO_JSON, process.env.WAVE_THREE_JSON]
              .flatMap(value => JSON.parse(value));
            if (JSON.stringify(assigned) !== JSON.stringify(horizons)) {
              throw new Error(`ordered waves do not cover every selected horizon exactly once: ${JSON.stringify(horizons)}`);
            }
            const budget = Number(process.env.BUDGET_MINUTES);
            const count = Math.min(horizons.length, 2);
            if (!Number.isFinite(budget) || budget < 1 || budget > 240) throw new Error(`budget_minutes must be from 1 to 240; received ${JSON.stringify(process.env.BUDGET_MINUTES)}`);
            if ((budget + 5) * count > 315) throw new Error(`${count} horizons in one wave at ${budget} minutes each could outrun the resumable-artifact window; reduce the budget`);
          '

          # The matrix is selected from the frozen cohort, never rebuilt from
          # today's active roster. This also verifies requested prompt files
          # against their stored hashes before any paid model job can start.
          models=$(node tools/check-sweep.mjs \
            --prepare-work \
            --plan-json "$sweep_plan" \
            --horizons-json "$horizons" \
            --requested-models "${REQUESTED_MODELS:-}")

          echo 'should_elicit=true' >> "$GITHUB_OUTPUT"
          echo "horizons=$horizons" >> "$GITHUB_OUTPUT"
          echo "wave_one_horizons=$wave_one_horizons" >> "$GITHUB_OUTPUT"
          echo "wave_two_horizons=$wave_two_horizons" >> "$GITHUB_OUTPUT"
          echo "wave_three_horizons=$wave_three_horizons" >> "$GITHUB_OUTPUT"
          echo "has_wave_two=$has_wave_two" >> "$GITHUB_OUTPUT"
          echo "has_wave_three=$has_wave_three" >> "$GITHUB_OUTPUT"
          echo "sweep_horizons=$sweep_horizons" >> "$GITHUB_OUTPUT"
          echo "target_samples=$target_samples" >> "$GITHUB_OUTPUT"
          echo "sweep_plan=$sweep_plan" >> "$GITHUB_OUTPUT"
          echo "models=$models" >> "$GITHUB_OUTPUT"
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"

      # Elicitation cannot start until this job finishes, so upload the single
      # authoritative plan before any paid call. Model artifacts intentionally
      # omit their own copies; the aggregate job restores this one verbatim.
      - name: Stage the immutable sweep plan
        if: steps.plan.outputs.should_elicit == 'true'
        env:
          RUN_DATE: ${{ steps.plan.outputs.run_date }}
          SWEEP_PLAN_JSON: ${{ steps.plan.outputs.sweep_plan }}
        run: |
          set -euo pipefail
          mkdir -p planned/.partial
          printf '%s\n' "$RUN_DATE" > planned/.partial/.elicitation-date
          printf '%s\n' "$SWEEP_PLAN_JSON" > planned/.partial/.sweep-plan.json

      - name: Upload the immutable sweep plan
        if: steps.plan.outputs.should_elicit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sweep-plan-${{ github.run_id }}
          path: planned/
          include-hidden-files: true
          retention-days: 90

  utility:
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.check_only || inputs.list_models) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: List available models
        if: inputs.list_models
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.MINSTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY || secrets.KIMI_API_KEY }}
          MODELS: ${{ inputs.models }}
        run: |
          set -euo pipefail
          argv=(--list)
          if [ -n "${MODELS:-}" ]; then argv+=(--models "$MODELS"); fi
          node tools/run-elicitation.mjs "${argv[@]}"

      - name: Preflight — verify keys and model ids
        if: inputs.check_only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.MINSTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY || secrets.KIMI_API_KEY }}
          MODELS: ${{ inputs.models }}
        run: |
          set -euo pipefail
          argv=(--check)
          if [ -n "${MODELS:-}" ]; then argv+=(--models "$MODELS"); fi
          node tools/run-elicitation.mjs "${argv[@]}"

  elicit_wave_one:
    needs: plan
    if: needs.plan.outputs.should_elicit == 'true'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every model job restores the same combined artifact, then copies only
      # its model's selected-horizon batches into an isolated working directory.
      # Keeping wave artifacts horizon-disjoint prevents merge-multiple from
      # letting an older restored batch overwrite a newer batch from the other
      # wave.
      - name: Restore a previous run
        if: ${{ inputs.resume_from_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: runs-${{ inputs.resume_from_run_id }}
          path: restored/
          run-id: ${{ inputs.resume_from_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare this model's resumable workspace
        env:
          MODEL_KEY: ${{ matrix.model }}
          RUN_DATE: ${{ needs.plan.outputs.run_date }}
          HORIZONS_JSON: ${{ needs.plan.outputs.wave_one_horizons }}
        run: |
          set -euo pipefail
          mkdir -p work/runs/.partial
          for source in runs restored; do
            if [ ! -d "$source" ]; then continue; fi
            SOURCE_DIR="$source" DEST_DIR=work/runs MODEL_KEY="$MODEL_KEY" RUN_DATE="$RUN_DATE" HORIZONS_JSON="$HORIZONS_JSON" node --input-type=module <<'NODE'
          import { copyFileSync, existsSync, mkdirSync, readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          import { HORIZON_RUN_CONFIG } from './tools/horizons.mjs';
          const roster = JSON.parse(readFileSync('tools/models.json', 'utf8')).models;
          const model = roster.find(candidate => candidate.key === process.env.MODEL_KEY);
          if (!model) throw new Error(`unknown model key ${process.env.MODEL_KEY}`);
          const slug = model.model.toLowerCase().replace(/[^a-z0-9.]+/g, '-').replace(/^-+|-+$/g, '');
          const prefixes = JSON.parse(process.env.HORIZONS_JSON).map(horizon => {
            const config = HORIZON_RUN_CONFIG[horizon];
            if (!config) throw new Error(`unsupported horizon ${horizon}`);
            return `${process.env.RUN_DATE}__${slug}__closed_book__${config.runSuffix}`;
          });
          const belongs = (file, extension) => prefixes.some(prefix =>
            file === `${prefix}.${extension}` || (extension === 'json' && new RegExp(`^${prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}__r(?:[2-9]|[1-9][0-9])\\.json$`).test(file)));
          const source = process.env.SOURCE_DIR;
          const destination = process.env.DEST_DIR;
          mkdirSync(join(destination, '.partial'), { recursive: true });
          for (const file of readdirSync(source).filter(file => belongs(file, 'json'))) {
            copyFileSync(join(source, file), join(destination, file));
          }
          const partial = join(source, '.partial');
          if (existsSync(partial)) {
            for (const file of readdirSync(partial).filter(file => belongs(file, 'jsonl'))) {
              copyFileSync(join(partial, file), join(destination, '.partial', file));
            }
          }
          NODE
          done
          touch "work/runs/.partial/.artifact-wave-1-${MODEL_KEY}"
          printf '%s\n' "$RUN_DATE" > work/runs/.partial/.elicitation-date

      - name: Elicit first horizon wave
        id: elicit
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.MINSTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY || secrets.KIMI_API_KEY }}
          MODEL_KEY: ${{ matrix.model }}
          HORIZONS_JSON: ${{ needs.plan.outputs.wave_one_horizons }}
          RUN_DATE: ${{ needs.plan.outputs.run_date }}
          SWEEP_PLAN_JSON: ${{ needs.plan.outputs.sweep_plan }}
          SAMPLES: ${{ needs.plan.outputs.target_samples }}
          BUDGET_MINUTES: ${{ inputs.budget_minutes || '100' }}
        run: |
          set -uo pipefail
          result=0
          quota=false

          while IFS= read -r horizon; do
            echo "Asking $MODEL_KEY for horizon $horizon"
            timeout_seconds=$(BUDGET_MINUTES="$BUDGET_MINUTES" node -e 'process.stdout.write(String(Math.ceil(Number(process.env.BUDGET_MINUTES) * 60) + 300))')
            # GitHub launches run blocks with bash -e. A command used as an if
            # condition is exempt from errexit, so we can capture a short-run
            # exit and continue without hiding a quota exit or final failure.
            if GITHUB_OUTPUT='' timeout --foreground --signal=TERM --kill-after=30s "${timeout_seconds}s" node tools/run-elicitation.mjs \
                --models "$MODEL_KEY" \
                --horizon "$horizon" \
                --date "$RUN_DATE" \
                --samples "$SAMPLES" \
                --budget-minutes "$BUDGET_MINUTES" \
                --out work/runs; then
              status=0
            else
              status=$?
            fi
            if [ "$status" -eq 4 ]; then
              quota=true
              result=4
              break
            elif [ "$status" -ne 0 ] && [ "$result" -eq 0 ]; then
              result=2
            fi
          done < <(HORIZONS_JSON="$HORIZONS_JSON" node -e 'for (const horizon of JSON.parse(process.env.HORIZONS_JSON)) console.log(horizon)')

          echo "quota_exhausted=$quota" >> "$GITHUB_OUTPUT"
          echo "failed=$([ "$result" -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Record model-job status
        if: always()
        env:
          MODEL_KEY: ${{ matrix.model }}
          OUTCOME: ${{ steps.elicit.outcome }}
          QUOTA: ${{ steps.elicit.outputs.quota_exhausted || 'false' }}
        run: |
          mkdir -p work/runs/.partial
          printf 'model=%s\nwave=1\noutcome=%s\nquota=%s\n' "$MODEL_KEY" "$OUTCOME" "$QUOTA" > "work/runs/.partial/.status-wave-1-${MODEL_KEY}"

      - name: Upload this model's first-wave batches and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ matrix.model }}-wave-1-${{ github.run_id }}
          path: work/runs/
          include-hidden-files: true
          retention-days: 90

      - name: Fail this first-wave model job after preserving its data
        if: steps.elicit.outcome == 'failure'
        env:
          MODEL_KEY: ${{ matrix.model }}
        run: |
          echo "::error::$MODEL_KEY did not complete every selected horizon; its paid samples are preserved."
          exit 1

  # This global dependency is deliberate: no model may enter its second wave
  # until every model has left the first one. That keeps each provider/model
  # pair single-flight while retaining the existing cross-model parallelism.
  elicit_wave_two:
    needs: [plan, elicit_wave_one]
    if: ${{ !cancelled() && needs.plan.outputs.should_elicit == 'true' && needs.plan.outputs.has_wave_two == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore a previous run
        if: ${{ inputs.resume_from_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: runs-${{ inputs.resume_from_run_id }}
          path: restored/
          run-id: ${{ inputs.resume_from_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Consume only the first-wave status here; its downloaded batches remain
      # outside the workspace. Aggregate combines both horizon-disjoint
      # artifacts after every model finishes.
      - name: Download this model's first-wave status
        uses: actions/download-artifact@v4
        with:
          name: model-${{ matrix.model }}-wave-1-${{ github.run_id }}
          path: prior-wave/

      - name: Prepare this model's resumable workspace
        env:
          MODEL_KEY: ${{ matrix.model }}
          RUN_DATE: ${{ needs.plan.outputs.run_date }}
          HORIZONS_JSON: ${{ needs.plan.outputs.wave_two_horizons }}
        run: |
          set -euo pipefail
          mkdir -p work/runs/.partial
          for source in runs restored; do
            if [ ! -d "$source" ]; then continue; fi
            SOURCE_DIR="$source" DEST_DIR=work/runs MODEL_KEY="$MODEL_KEY" RUN_DATE="$RUN_DATE" HORIZONS_JSON="$HORIZONS_JSON" node --input-type=module <<'NODE'
          import { copyFileSync, existsSync, mkdirSync, readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          import { HORIZON_RUN_CONFIG } from './tools/horizons.mjs';
          const roster = JSON.parse(readFileSync('tools/models.json', 'utf8')).models;
          const model = roster.find(candidate => candidate.key === process.env.MODEL_KEY);
          if (!model) throw new Error(`unknown model key ${process.env.MODEL_KEY}`);
          const slug = model.model.toLowerCase().replace(/[^a-z0-9.]+/g, '-').replace(/^-+|-+$/g, '');
          const prefixes = JSON.parse(process.env.HORIZONS_JSON).map(horizon => {
            const config = HORIZON_RUN_CONFIG[horizon];
            if (!config) throw new Error(`unsupported horizon ${horizon}`);
            return `${process.env.RUN_DATE}__${slug}__closed_book__${config.runSuffix}`;
          });
          const belongs = (file, extension) => prefixes.some(prefix =>
            file === `${prefix}.${extension}` || (extension === 'json' && new RegExp(`^${prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}__r(?:[2-9]|[1-9][0-9])\\.json$`).test(file)));
          const source = process.env.SOURCE_DIR;
          const destination = process.env.DEST_DIR;
          mkdirSync(join(destination, '.partial'), { recursive: true });
          for (const file of readdirSync(source).filter(file => belongs(file, 'json'))) {
            copyFileSync(join(source, file), join(destination, file));
          }
          const partial = join(source, '.partial');
          if (existsSync(partial)) {
            for (const file of readdirSync(partial).filter(file => belongs(file, 'jsonl'))) {
              copyFileSync(join(partial, file), join(destination, '.partial', file));
            }
          }
          NODE
          done
          touch "work/runs/.partial/.artifact-wave-2-${MODEL_KEY}"
          printf '%s\n' "$RUN_DATE" > work/runs/.partial/.elicitation-date

      - name: Elicit second horizon wave
        id: elicit
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.MINSTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY || secrets.KIMI_API_KEY }}
          MODEL_KEY: ${{ matrix.model }}
          HORIZONS_JSON: ${{ needs.plan.outputs.wave_two_horizons }}
          RUN_DATE: ${{ needs.plan.outputs.run_date }}
          SWEEP_PLAN_JSON: ${{ needs.plan.outputs.sweep_plan }}
          SAMPLES: ${{ needs.plan.outputs.target_samples }}
          BUDGET_MINUTES: ${{ inputs.budget_minutes || '100' }}
        run: |
          set -uo pipefail
          result=0
          quota=false
          previous_status="prior-wave/.partial/.status-wave-1-${MODEL_KEY}"

          # Preserve the original sequential-loop behavior: a billing failure
          # stops later horizons for this model, while other failures do not.
          if [ -f "$previous_status" ] && grep -q '^quota=true$' "$previous_status"; then
            echo "Skipping $MODEL_KEY's second wave because its provider exhausted quota in wave one."
            quota=true
            result=4
          else
            while IFS= read -r horizon; do
              echo "Asking $MODEL_KEY for horizon $horizon"
              timeout_seconds=$(BUDGET_MINUTES="$BUDGET_MINUTES" node -e 'process.stdout.write(String(Math.ceil(Number(process.env.BUDGET_MINUTES) * 60) + 300))')
              if GITHUB_OUTPUT='' timeout --foreground --signal=TERM --kill-after=30s "${timeout_seconds}s" node tools/run-elicitation.mjs \
                  --models "$MODEL_KEY" \
                  --horizon "$horizon" \
                  --date "$RUN_DATE" \
                  --samples "$SAMPLES" \
                  --budget-minutes "$BUDGET_MINUTES" \
                  --out work/runs; then
                status=0
              else
                status=$?
              fi
              if [ "$status" -eq 4 ]; then
                quota=true
                result=4
                break
              elif [ "$status" -ne 0 ] && [ "$result" -eq 0 ]; then
                result=2
              fi
            done < <(HORIZONS_JSON="$HORIZONS_JSON" node -e 'for (const horizon of JSON.parse(process.env.HORIZONS_JSON)) console.log(horizon)')
          fi

          echo "quota_exhausted=$quota" >> "$GITHUB_OUTPUT"
          echo "failed=$([ "$result" -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Record model-job status
        if: always()
        env:
          MODEL_KEY: ${{ matrix.model }}
          OUTCOME: ${{ steps.elicit.outcome }}
          QUOTA: ${{ steps.elicit.outputs.quota_exhausted || 'false' }}
        run: |
          mkdir -p work/runs/.partial
          printf 'model=%s\nwave=2\noutcome=%s\nquota=%s\n' "$MODEL_KEY" "$OUTCOME" "$QUOTA" > "work/runs/.partial/.status-wave-2-${MODEL_KEY}"

      - name: Upload this model's second-wave batches and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ matrix.model }}-wave-2-${{ github.run_id }}
          path: work/runs/
          include-hidden-files: true
          retention-days: 90

      - name: Fail this second-wave model job after preserving its data
        if: steps.elicit.outcome == 'failure'
        env:
          MODEL_KEY: ${{ matrix.model }}
        run: |
          echo "::error::$MODEL_KEY did not complete every selected horizon; its paid samples are preserved."
          exit 1

  # The final global barrier keeps the fifth horizon single-flight with both
  # earlier waves. Quota state is propagated through wave two, so checking its
  # status suppresses this model even when the original billing failure was in
  # wave one.
  elicit_wave_three:
    needs: [plan, elicit_wave_one, elicit_wave_two]
    if: ${{ !cancelled() && needs.plan.outputs.should_elicit == 'true' && needs.plan.outputs.has_wave_three == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore a previous run
        if: ${{ inputs.resume_from_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: runs-${{ inputs.resume_from_run_id }}
          path: restored/
          run-id: ${{ inputs.resume_from_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Consume only the second-wave status here; aggregate combines all three
      # horizon-disjoint artifacts after every model finishes.
      - name: Download this model's second-wave status
        uses: actions/download-artifact@v4
        with:
          name: model-${{ matrix.model }}-wave-2-${{ github.run_id }}
          path: prior-wave/

      - name: Prepare this model's resumable workspace
        env:
          MODEL_KEY: ${{ matrix.model }}
          RUN_DATE: ${{ needs.plan.outputs.run_date }}
          HORIZONS_JSON: ${{ needs.plan.outputs.wave_three_horizons }}
        run: |
          set -euo pipefail
          mkdir -p work/runs/.partial
          for source in runs restored; do
            if [ ! -d "$source" ]; then continue; fi
            SOURCE_DIR="$source" DEST_DIR=work/runs MODEL_KEY="$MODEL_KEY" RUN_DATE="$RUN_DATE" HORIZONS_JSON="$HORIZONS_JSON" node --input-type=module <<'NODE'
          import { copyFileSync, existsSync, mkdirSync, readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          import { HORIZON_RUN_CONFIG } from './tools/horizons.mjs';
          const roster = JSON.parse(readFileSync('tools/models.json', 'utf8')).models;
          const model = roster.find(candidate => candidate.key === process.env.MODEL_KEY);
          if (!model) throw new Error(`unknown model key ${process.env.MODEL_KEY}`);
          const slug = model.model.toLowerCase().replace(/[^a-z0-9.]+/g, '-').replace(/^-+|-+$/g, '');
          const prefixes = JSON.parse(process.env.HORIZONS_JSON).map(horizon => {
            const config = HORIZON_RUN_CONFIG[horizon];
            if (!config) throw new Error(`unsupported horizon ${horizon}`);
            return `${process.env.RUN_DATE}__${slug}__closed_book__${config.runSuffix}`;
          });
          const belongs = (file, extension) => prefixes.some(prefix =>
            file === `${prefix}.${extension}` || (extension === 'json' && new RegExp(`^${prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}__r(?:[2-9]|[1-9][0-9])\\.json$`).test(file)));
          const source = process.env.SOURCE_DIR;
          const destination = process.env.DEST_DIR;
          mkdirSync(join(destination, '.partial'), { recursive: true });
          for (const file of readdirSync(source).filter(file => belongs(file, 'json'))) {
            copyFileSync(join(source, file), join(destination, file));
          }
          const partial = join(source, '.partial');
          if (existsSync(partial)) {
            for (const file of readdirSync(partial).filter(file => belongs(file, 'jsonl'))) {
              copyFileSync(join(partial, file), join(destination, '.partial', file));
            }
          }
          NODE
          done
          touch "work/runs/.partial/.artifact-wave-3-${MODEL_KEY}"
          printf '%s\n' "$RUN_DATE" > work/runs/.partial/.elicitation-date

      - name: Elicit third horizon wave
        id: elicit
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.MINSTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY || secrets.KIMI_API_KEY }}
          MODEL_KEY: ${{ matrix.model }}
          HORIZONS_JSON: ${{ needs.plan.outputs.wave_three_horizons }}
          RUN_DATE: ${{ needs.plan.outputs.run_date }}
          SWEEP_PLAN_JSON: ${{ needs.plan.outputs.sweep_plan }}
          SAMPLES: ${{ needs.plan.outputs.target_samples }}
          BUDGET_MINUTES: ${{ inputs.budget_minutes || '100' }}
        run: |
          set -uo pipefail
          result=0
          quota=false
          previous_status="prior-wave/.partial/.status-wave-2-${MODEL_KEY}"

          if [ -f "$previous_status" ] && grep -q '^quota=true$' "$previous_status"; then
            echo "Skipping $MODEL_KEY's third wave because its provider exhausted quota in an earlier wave."
            quota=true
            result=4
          else
            while IFS= read -r horizon; do
              echo "Asking $MODEL_KEY for horizon $horizon"
              timeout_seconds=$(BUDGET_MINUTES="$BUDGET_MINUTES" node -e 'process.stdout.write(String(Math.ceil(Number(process.env.BUDGET_MINUTES) * 60) + 300))')
              if GITHUB_OUTPUT='' timeout --foreground --signal=TERM --kill-after=30s "${timeout_seconds}s" node tools/run-elicitation.mjs \
                  --models "$MODEL_KEY" \
                  --horizon "$horizon" \
                  --date "$RUN_DATE" \
                  --samples "$SAMPLES" \
                  --budget-minutes "$BUDGET_MINUTES" \
                  --out work/runs; then
                status=0
              else
                status=$?
              fi
              if [ "$status" -eq 4 ]; then
                quota=true
                result=4
                break
              elif [ "$status" -ne 0 ] && [ "$result" -eq 0 ]; then
                result=2
              fi
            done < <(HORIZONS_JSON="$HORIZONS_JSON" node -e 'for (const horizon of JSON.parse(process.env.HORIZONS_JSON)) console.log(horizon)')
          fi

          echo "quota_exhausted=$quota" >> "$GITHUB_OUTPUT"
          echo "failed=$([ "$result" -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Record model-job status
        if: always()
        env:
          MODEL_KEY: ${{ matrix.model }}
          OUTCOME: ${{ steps.elicit.outcome }}
          QUOTA: ${{ steps.elicit.outputs.quota_exhausted || 'false' }}
        run: |
          mkdir -p work/runs/.partial
          printf 'model=%s\nwave=3\noutcome=%s\nquota=%s\n' "$MODEL_KEY" "$OUTCOME" "$QUOTA" > "work/runs/.partial/.status-wave-3-${MODEL_KEY}"

      - name: Upload this model's third-wave batches and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ matrix.model }}-wave-3-${{ github.run_id }}
          path: work/runs/
          include-hidden-files: true
          retention-days: 90

      - name: Fail this third-wave model job after preserving its data
        if: steps.elicit.outcome == 'failure'
        env:
          MODEL_KEY: ${{ matrix.model }}
        run: |
          echo "::error::$MODEL_KEY did not complete every selected horizon; its paid samples are preserved."
          exit 1

  aggregate:
    needs: [plan, elicit_wave_one, elicit_wave_two, elicit_wave_three]
    if: ${{ always() && needs.plan.outputs.should_elicit == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A subset resume must start from the previous combined artifact. The
      # selected model artifacts below then replace only the models rerun now.
      - name: Restore the previous combined run
        if: ${{ inputs.resume_from_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: runs-${{ inputs.resume_from_run_id }}
          path: restored/
          run-id: ${{ inputs.resume_from_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download every first-wave model artifact
        uses: actions/download-artifact@v4
        with:
          pattern: model-*-wave-1-${{ github.run_id }}
          path: collected/
          merge-multiple: true

      - name: Download every second-wave model artifact
        if: needs.plan.outputs.has_wave_two == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: model-*-wave-2-${{ github.run_id }}
          path: collected/
          merge-multiple: true

      - name: Download every third-wave model artifact
        if: needs.plan.outputs.has_wave_three == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: model-*-wave-3-${{ github.run_id }}
          path: collected/
          merge-multiple: true

      - name: Download the immutable sweep plan
        uses: actions/download-artifact@v4
        with:
          name: sweep-plan-${{ github.run_id }}
          path: planned/

      - name: Merge batches and inspect model-job status
        id: merge
        env:
          SWEEP_PLAN_JSON: ${{ needs.plan.outputs.sweep_plan }}
          RUN_DATE: ${{ needs.plan.outputs.run_date }}
        run: |
          set -euo pipefail
          mkdir -p runs/.partial
          if [ -d restored ]; then
            cp -R restored/. runs/
          fi
          # Current artifacts win over the restored combined snapshot.
          cp -R collected/. runs/
          # The plan job's pre-call artifact is the only authority. Restore it
          # after model artifacts and require exact compact JSON/date matches.
          cp -R planned/. runs/
          actual_plan=$(tr -d '\r\n' < runs/.partial/.sweep-plan.json)
          actual_date=$(tr -d '[:space:]' < runs/.partial/.elicitation-date)
          if [ "$actual_plan" != "$SWEEP_PLAN_JSON" ]; then
            echo "::error::The combined artifact does not contain the immutable sweep plan emitted by the plan job."
            exit 1
          fi
          if [ "$actual_date" != "$RUN_DATE" ]; then
            echo "::error::The combined artifact date $actual_date does not match the sweep plan date $RUN_DATE."
            exit 1
          fi

          failed=false
          quota_models=''
          declare -A quota_seen=()
          for status_file in runs/.partial/.status-*; do
            if [ ! -f "$status_file" ]; then continue; fi
            if grep -q '^outcome=failure$' "$status_file"; then failed=true; fi
            if grep -q '^quota=true$' "$status_file"; then
              model=$(sed -n 's/^model=//p' "$status_file" | head -n 1)
              if [ -z "$model" ]; then
                echo "::error::$status_file has quota=true but no model identity."
                failed=true
              elif [ -z "${quota_seen[$model]+x}" ]; then
                quota_models="${quota_models}${quota_models:+, }${model}"
                quota_seen[$model]=1
              fi
            fi
          done
          rm -f runs/.partial/.status-* runs/.partial/.artifact-*

          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "quota_models=$quota_models" >> "$GITHUB_OUTPUT"

      # This is the artifact future re-dispatches restore. It is written before
      # verification or publishing so a downstream bug cannot strand paid data.
      - name: Upload the combined resumable run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ github.run_id }}
          path: runs/
          include-hidden-files: true
          retention-days: 90

      - name: Verify raw batches
        run: node tools/verify-runs.mjs

      # Integrity alone is not publication readiness. In particular, a resume
      # aimed at one failed model can restore valid but incomplete batches for
      # other active models. Keep the gate non-blocking here so those paid raw
      # results still reach the branch and resumable artifact; every site step
      # below checks the gate's original outcome explicitly.
      - name: Check complete requested sweep
        id: sweep
        continue-on-error: true
        env:
          SWEEP_PLAN_JSON: ${{ needs.plan.outputs.sweep_plan }}
        run: |
          set -euo pipefail
          node tools/check-sweep.mjs --plan-json "$SWEEP_PLAN_JSON"

      - name: Raise a billing alert
        if: steps.merge.outputs.quota_models != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS: ${{ steps.merge.outputs.quota_models }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create billing --color B60205 --description "Provider quota or credit" 2>/dev/null || true
          if [ -n "$(gh issue list --label billing --state open --limit 1 --json number --jq '.[].number')" ]; then
            echo "A billing issue is already open — not filing another."
            exit 0
          fi
          gh issue create \
            --title "Elicitation blocked: out of quota or credit" \
            --label billing \
            --body "Elicitation stopped for these model keys: **$MODELS**. Paid samples are preserved in the combined artifact. Top up the affected provider and resume from workflow run ${{ github.run_id }}. Full run: $RUN_URL"

      # Raw JSON batches are pushed even when a model came back short. The site
      # is regenerated only after every selected model and horizon completed.
      - name: Push the raw batches
        id: push_runs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="elicitation/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Record the generated runs in an ephemeral local commit so a
          # three-way squash can carry both them and every non-workflow feature
          # change onto the latest default branch.
          git add runs
          git commit --allow-empty -m "Stage collected elicitation batches"

          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --prune --unshallow origin
          else
            git fetch --no-tags --prune origin
          fi
          default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          git rev-parse --verify "$default_ref^{commit}" >/dev/null
          if ! merge_base=$(git merge-base "$SOURCE_SHA" "$default_ref"); then
            echo "::error::Cannot find a merge base between the workflow source and $default_ref."
            exit 1
          fi

          # GitHub's Actions token cannot create a branch containing workflow
          # changes. Rewrite only the ephemeral source tree so workflows match
          # the merge base; the squash will therefore retain the latest default
          # branch versions without publishing feature-branch workflow edits.
          git restore --source="$merge_base" --staged --worktree -- .github/workflows
          git commit --amend --no-edit
          publish_source_sha=$(git rev-parse HEAD)

          git checkout -b "$branch" "$default_ref"
          git merge --squash --no-commit "$publish_source_sha"
          git restore --source="$default_ref" --staged --worktree -- .github/workflows

          publish_raw=false
          if git diff --cached --quiet; then
            echo "No new batches to push."
            echo 'pushed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add raw horizon elicitation batches"
            publish_raw=true
          fi
          if ! git diff --quiet "$default_ref" HEAD -- .github/workflows; then
            echo "::error::Refusing to publish a commit that changes .github/workflows."
            exit 1
          fi
          if [ "$publish_raw" = "true" ]; then
            git push origin "$branch"
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
            echo "Raw batches pushed to \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
          fi

          # The branch must retain the default branch's trusted workflow, but
          # the remainder of this running job must test the workflow source
          # that launched it. Restore source into the working tree only; never
          # stage it, so the later site-data commit cannot publish this change.
          git restore --source="$SOURCE_SHA" --worktree -- .github/workflows
          if ! git diff --quiet "$SOURCE_SHA" -- .github/workflows; then
            echo "::error::Could not restore the source workflow for local checks."
            exit 1
          fi
          if ! git diff --cached --quiet; then
            echo "::error::Source workflow restore unexpectedly staged files."
            exit 1
          fi

      - name: Import every horizon into site data
        if: needs.elicit_wave_one.result == 'success' && (needs.plan.outputs.has_wave_two != 'true' || needs.elicit_wave_two.result == 'success') && (needs.plan.outputs.has_wave_three != 'true' || needs.elicit_wave_three.result == 'success') && steps.merge.outputs.failed == 'false' && steps.sweep.outcome == 'success'
        run: |
          set -euo pipefail
          node tools/import-runs.mjs
          node tools/export-data.mjs

      - name: Check the complete site
        if: needs.elicit_wave_one.result == 'success' && (needs.plan.outputs.has_wave_two != 'true' || needs.elicit_wave_two.result == 'success') && (needs.plan.outputs.has_wave_three != 'true' || needs.elicit_wave_three.result == 'success') && steps.merge.outputs.failed == 'false' && steps.sweep.outcome == 'success'
        run: node tools/check-all.mjs

      - name: Push the regenerated site
        if: needs.elicit_wave_one.result == 'success' && (needs.plan.outputs.has_wave_two != 'true' || needs.elicit_wave_two.result == 'success') && (needs.plan.outputs.has_wave_three != 'true' || needs.elicit_wave_three.result == 'success') && steps.merge.outputs.failed == 'false' && steps.sweep.outcome == 'success'
        run: |
          set -euo pipefail
          branch="elicitation/${{ github.run_id }}"
          git add public/data.js data
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git commit -m "Regenerate all horizon datasets"
          git push origin "$branch"
          echo "Site data pushed. Open a PR from \`$branch\` to publish." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail after preserving incomplete results
        if: ${{ always() && (needs.elicit_wave_one.result != 'success' || (needs.plan.outputs.has_wave_two == 'true' && needs.elicit_wave_two.result != 'success') || (needs.plan.outputs.has_wave_three == 'true' && needs.elicit_wave_three.result != 'success') || steps.merge.outputs.failed == 'true' || steps.sweep.outcome != 'success') }}
        run: |
          echo "::error::At least one model/horizon is incomplete or the full same-date sweep gate did not pass. Raw batches and checkpoints were preserved; resume from run ${{ github.run_id }}."
          exit 1
