name: CI

# runs/ is the irreplaceable half of this repository — public/data.js can be
# regenerated from it, and it cannot be regenerated from anything. Check it on
# every push rather than only after an elicitation.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse the application
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/data.js

      - name: Verify raw batches
        run: node tools/verify-runs.mjs

      - name: Verify published data
        run: node tools/check-site.mjs

      # Fetched with no credentials: a private repo, or anything else behind a
      # login, resolves for its author and 404s for a visitor.
      - name: Check every published link
        run: node tools/check-links.mjs

      - name: Unit and harness tests
        run: node --test tools/test-classify.mjs tools/test-harness.mjs

      # The importer must be a pure function of runs/: if re-running it changes
      # public/data.js, the committed file was hand-edited or is out of date.
      - name: Published data matches runs/
        run: |
          set -euo pipefail
          node tools/import-runs.mjs
          node tools/export-data.mjs
          if ! git diff --quiet public/data.js data; then
            echo "::error::public/data.js or data/ does not match what runs/ produces. Run tools/import-runs.mjs and tools/export-data.mjs and commit the result."
            git --no-pager diff --stat public/data.js data
            exit 1
          fi
          echo "public/data.js and data/ are reproducible from runs/"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      # The runner has none of the condensed faces the design asks for, so it
      # renders the pessimistic fallback — which is exactly the case that
      # clipped headings on iOS.
      - name: Layout and behaviour
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
