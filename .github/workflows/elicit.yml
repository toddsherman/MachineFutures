name: Elicit end-state forecasts

on:
  schedule:
    # 14:00 UTC on the 1st of every month. Gated on the ELICITATION_ENABLED
    # repository variable so scheduled runs stay off until keys are configured.
    - cron: '0 14 1 * *'
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated model keys from tools/models.json (default: all)'
        required: false
      samples:
        description: 'Samples per model'
        required: false
        default: '5'
      check_only:
        description: 'Preflight only — verify keys and model ids, elicit nothing'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  elicit:
    if: github.event_name == 'workflow_dispatch' || vars.ELICITATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight — verify keys and model ids
        if: inputs.check_only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: node tools/run-elicitation.mjs --check

      - name: Elicit forecasts
        if: ${{ !inputs.check_only }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: >
          node tools/run-elicitation.mjs
          --samples ${{ inputs.samples || '5' }}
          ${{ inputs.models && format('--models {0}', inputs.models) || '' }}

      - name: Import into site data
        if: ${{ !inputs.check_only }}
        run: node tools/import-runs.mjs

      - name: Syntax-check generated data
        if: ${{ !inputs.check_only }}
        run: node --check public/data.js

      - name: Open pull request
        if: ${{ !inputs.check_only }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: elicitation/${{ github.run_id }}
          delete-branch: true
          commit-message: 'Add automated end-state elicitation run'
          title: 'Automated end-state elicitation'
          body: |
            Scheduled elicitation run. Raw batches are in `runs/`; `public/data.js`
            was regenerated by `tools/import-runs.mjs`.

            Review the numbers and rationales, then merge to publish — Vercel
            deploys `public/` on merge to main.
