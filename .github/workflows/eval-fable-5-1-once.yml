name: One-time Claude Fable 5.1 eval

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eval-fable-5-1-once.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: fable-5-1-one-time-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight Claude Fable 5.1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tools/run-elicitation.mjs --check --models anthropic

      - name: Elicit Claude Fable 5.1 forecasts
        id: elicit
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tools/run-elicitation.mjs --models anthropic --samples 20 --budget-minutes 90

      - name: Upload raw batches
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ github.run_id }}
          path: |
            runs/
            !runs/.mock/
          include-hidden-files: true
          retention-days: 90

      - name: Fail if elicitation failed
        if: ${{ steps.elicit.outcome == 'failure' }}
        run: |
          echo "::error::Claude Fable 5.1 elicitation failed. Raw batches or checkpoints were uploaded when available."
          exit 1

      - name: Import and export site data
        run: |
          set -euo pipefail
          node tools/import-runs.mjs
          node tools/export-data.mjs

      - name: Check generated site data
        run: |
          set -euo pipefail
          node --check public/data.js
          node --check public/app.js
          node tools/verify-runs.mjs
          node tools/check-site.mjs

      - name: Commit results to main and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/eval-fable-5-1-once.yml
          git add runs public/data.js data tools/models.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Claude Fable 5.1 elicitation results"
          git push origin HEAD:main
